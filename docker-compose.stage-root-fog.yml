services:
  cloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: blockcap-node
    restart: unless-stopped
    environment:
      NODE_ROLE: cloud
      ADMIN_TOKEN: "${ADMIN_TOKEN:-changeme}"
      FLASK_PORT: 5600
      SCENARIO_NAME: stage-root-fog
    volumes:
      - "cloud-data:/app/Node_root/data"
      - "cloud-genesis:/app/Node_root/genesis"
    ports:
      - "5600:5600"
      - "8545:8545"
      - "30303:30303"
    deploy:
      resources:
        limits:
          cpus: 4.0
          memory: 2g
  fog1:
    image: blockcap-node
    restart: unless-stopped
    environment:
      NODE_ROLE: fog
      ROOT_URL: "http://cloud:5600"
      PARENT_URL: "http://cloud:5600"
      FLASK_PORT: 5600
      SIMULATED_DEVICE_ID: jetson-orin-nano-8gb
      SCENARIO_NAME: stage-root-fog
    volumes:
      - "fog1-data:/app/Node_root/data"
      - "fog1-genesis:/app/Node_root/genesis"
    ports:
      - "5601:5600"
    depends_on:
      - cloud
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 512m
volumes:
  cloud-data:
  cloud-genesis:
  fog1-genesis:
  fog1-data:
