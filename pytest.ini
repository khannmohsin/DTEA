[pytest]
minversion = 8.0
addopts = -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    scripts
    tests
    Node_root/scripts
    Node_root/tests
norecursedirs =
    .git
    .venv
    node_modules
    runtime
    results
markers =
    integration: requires a running topology and external services
    slow: long-running experiments
